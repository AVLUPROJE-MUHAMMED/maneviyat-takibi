name: Teshis (tek seferlik)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/teshis.mjs
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
